[build-system]
requires = ["setuptools>=67", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "uv-pack"
dynamic = ["version"]
description = "Universal cross-platform Python packager powered by uv"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Amar Prakash Pandey", email = "amar.om1994@gmail.com" }
]
keywords = ["packaging", "pex", "jar", "zip", "uv", "cross-platform"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console"
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.5",
  "tomli>=2.0; python_version<'3.11'",
]

[project.urls]
Homepage = "https://github.com/amarlearning/uv-pack"
Repository = "https://github.com/amarlearning/uv-pack"

[project.scripts]
uv-pack = "uv_pack.cli:app"

[tool.setuptools.package-data]
uv_pack = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --cov=uv_pack --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/uv_pack"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "PL"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/uv_pack/adapters/process.py" = ["S603"]
"validation/validate_artifacts.py" = ["S603"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
show_error_codes = true
pretty = true
namespace_packages = true
mypy_path = "src"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-xdist>=3.5",
  "pytest-mock>=3.12",
  "hypothesis>=6.92",
  "ruff>=0.5.0",
  "black==24.10.0",
  "mypy>=1.9",
]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
