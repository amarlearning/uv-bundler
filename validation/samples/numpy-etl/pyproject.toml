[project]
name = "numpy-etl"
version = "0.1.0"
description = "NumPy/Pandas ETL example — native extension wheel resolution for x86_64 and aarch64"
requires-python = ">=3.10"
dependencies = [
  # Pin to versions with known manylinux2014 binary wheels for Python 3.10
  # on both x86_64 and aarch64. Newer pandas/numpy may only ship sdists for
  # older Python versions, causing source builds to fail in cross-arch CI.
  "numpy==1.26.4",
  "pandas==2.2.3",
]

[tool.uv-pack]
project_name = "numpy-etl"
default_target = "etl-x86_64"
output_base = "./dist"

# PEX is the correct format for C extensions (numpy/pandas .so files cannot
# be loaded via zipimport — PEX extracts them to disk before importing).

[tool.uv-pack.targets.etl-x86_64]
format = "pex"
entry_point = "etl.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"

[tool.uv-pack.targets.etl-aarch64]
format = "pex"
entry_point = "etl.main:run"
platform = "linux"
arch = "aarch64"
python_version = "3.10"
manylinux = "2014"
