[project]
name = "lambda-jobs"
version = "0.1.0"
description = "AWS Lambda jobs example for uv-pack"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35",
]

[tool.uv-pack]
project_name = "lambda-jobs"
default_target = "lambda-zip"
output_base = "./dist"

[tool.uv-pack.targets.lambda-zip]
format = "zip"
entry_point = "lambda_jobs.handler:handler"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"
bundle = "fat"
include_binaries = true
compression = "deflated"
