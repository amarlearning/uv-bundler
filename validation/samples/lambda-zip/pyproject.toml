[project]
name = "lambda-zip"
version = "0.1.0"
description = "AWS Lambda ZIP example — x86_64 and aarch64 (Graviton) targets"
requires-python = ">=3.10"
# orjson is NOT in the Lambda runtime and ships native code, so a passing
# invocation proves the ZIP carries the right Linux wheels at the right path.
dependencies = [
  "orjson>=3.10",
]

[tool.uv-bundler]
project_name = "lambda-zip"
default_target = "lambda-x86_64"
output_base = "./dist"

[tool.uv-bundler.targets.lambda-x86_64]
format = "zip"
entry_point = "lambda_jobs.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.12"
manylinux = "2014"

# AWS Lambda Graviton (ARM) — same source, different arch.
# Ghost Resolution fetches linux/aarch64 wheels from any build host.
[tool.uv-bundler.targets.lambda-aarch64]
format = "zip"
entry_point = "lambda_jobs.main:run"
platform = "linux"
arch = "aarch64"
python_version = "3.12"
manylinux = "2014"
