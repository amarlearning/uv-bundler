[project]
name = "single-spark-job"
version = "0.1.0"
description = "Single Spark job example for uv-bundler"
requires-python = ">=3.10"
# Runtime deps bundled into the artifact. pyspark itself is provided by the
# cluster, so it lives in the dev group: available locally, never bundled.
dependencies = [
  "tabulate>=0.9",
]

[dependency-groups]
dev = ["pyspark>=4.0,<5"]

[tool.uv-bundler]
project_name = "single-spark-job"
default_target = "spark-jar"
output_base = "./dist"

[tool.uv-bundler.targets.spark-jar]
format = "jar"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"
compression = "deflated"

[tool.uv-bundler.targets.spark-zip]
format = "zip"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"

[tool.uv-bundler.targets.spark-pex]
format = "pex"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"

[tool.uv-bundler.targets.spark-jar-slim]
format = "jar"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"
compression = "deflated"
slim = true

[tool.uv-bundler.targets.spark-zip-slim]
format = "zip"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"
slim = true

[tool.uv-bundler.targets.spark-pex-slim]
format = "pex"
entry_point = "app.main:run"
platform = "linux"
arch = "x86_64"
python_version = "3.10"
manylinux = "2014"
slim = true
