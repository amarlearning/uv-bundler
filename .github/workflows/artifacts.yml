name: Build & Validate Artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Build the uv-bundler distribution wheel ─────────────────────────────────
  build-wheel:
    name: Build uv-bundler wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: uv-bundler-wheel
          path: dist/uv_bundler-*-py3-none-any.whl
          retention-days: 1

  # ── Cross-platform artifact builds ───────────────────────────────────────
  #
  # Three samples are built per runner, each targeting the OPPOSITE arch from
  # the runner to exercise Ghost Resolution (uv pip compile/install --python-platform):
  #
  #   ubuntu-latest     (x86_64 host) → builds for linux/aarch64
  #   ubuntu-24.04-arm  (aarch64 host) → builds for linux/x86_64
  #
  # Samples and formats:
  #   single-spark-job  JAR + ZIP + PEX   pyspark (pure Python)
  #   numpy-etl         PEX               numpy + pandas (C extensions — PEX extracts .so to disk)
  #   lambda-zip        ZIP               boto3 (pure Python, Lambda deployment format)
  #
  build-linux:
    name: Build linux/${{ matrix.target-arch }} on ${{ matrix.runner-arch }}
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest        # x86_64 host → aarch64 target
            runner-arch: x86_64
            target-arch: aarch64
          - runner: ubuntu-24.04-arm     # aarch64 host → x86_64 target
            runner-arch: aarch64
            target-arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download uv-bundler wheel
        uses: actions/download-artifact@v4
        with:
          name: uv-bundler-wheel
          path: dist

      # uv must be on PATH so uv-bundler can invoke `uv pip compile/install`
      - uses: astral-sh/setup-uv@v5

      - name: Install uv-bundler and pex
        run: pip install dist/uv_bundler-*.whl pex

      # PEX caches downloaded wheels in ~/.pex; key by arch + all PEX sample pyproject hashes
      - name: Cache PEX downloads
        uses: actions/cache@v4
        with:
          path: ~/.pex
          key: pex-linux-${{ matrix.target-arch }}-${{ hashFiles('validation/samples/single-spark-job/pyproject.toml', 'validation/samples/numpy-etl/pyproject.toml') }}
          restore-keys: pex-linux-${{ matrix.target-arch }}-

      # ── single-spark-job (JAR + ZIP + PEX) ───────────────────────────────
      - name: Build single-spark-job for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/single-spark-job
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p "$OUT_DIR"
          uv-bundler --target spark-jar --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-zip --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-pex --arch ${{ matrix.target-arch }}

      # ── numpy-etl (PEX — C extensions require PEX, not JAR/ZIP) ──────────
      - name: Build numpy-etl for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/numpy-etl
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          uv-bundler --target etl-${{ matrix.target-arch }}

      # ── lambda-zip (ZIP — pure Python boto3, Lambda deployment format) ────
      - name: Build lambda-zip for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/lambda-zip
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          uv-bundler --target lambda-${{ matrix.target-arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-${{ matrix.target-arch }}
          path: |
            artifacts/single-spark-job-linux-${{ matrix.target-arch }}.*
            artifacts/numpy-etl-linux-${{ matrix.target-arch }}.*
            artifacts/lambda-zip-linux-${{ matrix.target-arch }}.*
          retention-days: 7

  # ── Runtime validation ────────────────────────────────────────────────────
  #
  # Each artifact set is validated on the NATIVE runner for that arch,
  # inside python:3.10-slim Docker — the exact target environment.
  #
  # Separate steps per format and sample so failures are immediately visible.
  # No packages are pre-installed: fat artifacts must be fully self-contained.
  #
  validate-linux:
    name: Validate linux/${{ matrix.target-arch }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest       # x86_64 runtime
            target-arch: x86_64
          - runner: ubuntu-24.04-arm    # aarch64 runtime
            target-arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      SPARK_STEM: single-spark-job-linux-${{ matrix.target-arch }}
      ETL_STEM: numpy-etl-linux-${{ matrix.target-arch }}
      LAMBDA_STEM: lambda-zip-linux-${{ matrix.target-arch }}
      IMAGE: python:3.10-slim
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-linux-${{ matrix.target-arch }}
          path: artifacts

      # ── single-spark-job ─────────────────────────────────────────────────
      - name: Run single-spark-job JAR in linux/${{ matrix.target-arch }} container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "$IMAGE" \
            sh -c "python /artifacts/$SPARK_STEM.jar | tee /dev/stderr | grep -q 'Running single Spark job with pyspark'"

      - name: Run single-spark-job ZIP in linux/${{ matrix.target-arch }} container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "$IMAGE" \
            sh -c "python /artifacts/$SPARK_STEM.zip | tee /dev/stderr | grep -q 'Running single Spark job with pyspark'"

      - name: Run single-spark-job PEX in linux/${{ matrix.target-arch }} container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "$IMAGE" \
            sh -c "python /artifacts/$SPARK_STEM.pex | tee /dev/stderr | grep -q 'Running single Spark job with pyspark'"

      # ── numpy-etl (native numpy/pandas C extensions via PEX) ─────────────
      - name: Run numpy-etl PEX in linux/${{ matrix.target-arch }} container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "$IMAGE" \
            sh -c "python /artifacts/$ETL_STEM.pex | tee /dev/stderr | grep -q 'ETL complete'"

      # ── lambda-zip (pure Python boto3 in ZIP format) ──────────────────────
      - name: Run lambda-zip ZIP in linux/${{ matrix.target-arch }} container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/artifacts" \
            "$IMAGE" \
            sh -c "python /artifacts/$LAMBDA_STEM.zip | tee /dev/stderr | grep -q 'lambda ok'"
