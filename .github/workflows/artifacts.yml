name: Build & Validate Artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Build the uv-bundler distribution wheel ─────────────────────────────────
  build-wheel:
    name: Build uv-bundler wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v6
        with:
          name: uv-bundler-wheel
          path: dist/uv_bundler-*-py3-none-any.whl
          retention-days: 1

  # ── Cross-platform artifact builds ───────────────────────────────────────
  #
  # Three samples are built per runner, each targeting a platform the runner is
  # NOT, to exercise Ghost Resolution (uv pip compile/install --python-platform):
  #
  #   ubuntu-latest     (x86_64 host)        → builds for linux/aarch64
  #   ubuntu-24.04-arm  (aarch64 host)       → builds for linux/x86_64
  #   macos-latest      (Apple Silicon host) → builds for linux/x86_64 + linux/aarch64
  #
  # Samples and formats:
  #   single-spark-job  JAR + ZIP + PEX              tabulate bundled; pyspark provided by the cluster
  #   single-spark-job  JAR + ZIP + PEX (slim)       source only, no deps bundled
  #   numpy-etl         PEX                           numpy + pandas (C extensions — PEX extracts .so to disk)
  #   lambda-zip        ZIP                           orjson (native, not in the Lambda runtime)
  #
  build-linux:
    name: Build linux/${{ matrix.target-arch }} on ${{ matrix.host }}/${{ matrix.runner-arch }}
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest        # x86_64 host → aarch64 target
            host: linux
            runner-arch: x86_64
            target-arch: aarch64
          - runner: ubuntu-24.04-arm     # aarch64 host → x86_64 target
            host: linux
            runner-arch: aarch64
            target-arch: x86_64
          # The headline use case: Linux artifacts built on a Mac.
          - runner: macos-latest
            host: macos
            runner-arch: aarch64
            target-arch: x86_64
          - runner: macos-latest
            host: macos
            runner-arch: aarch64
            target-arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Download uv-bundler wheel
        uses: actions/download-artifact@v7
        with:
          name: uv-bundler-wheel
          path: dist

      # uv must be on PATH so uv-bundler can invoke `uv pip compile/install`
      - uses: astral-sh/setup-uv@v7

      # uv tool install behaves the same on every runner (macOS system Python
      # refuses a bare `pip install` under PEP 668).
      - name: Install uv-bundler and pex
        run: |
          uv tool install dist/uv_bundler-*.whl
          uv tool install pex

      # PEX caches downloaded wheels in ~/.pex; key by arch + all PEX sample pyproject hashes
      - name: Cache PEX downloads
        uses: actions/cache@v5
        with:
          path: ~/.pex
          key: pex-${{ matrix.host }}-host-linux-${{ matrix.target-arch }}-${{ hashFiles('validation/samples/single-spark-job/pyproject.toml', 'validation/samples/numpy-etl/pyproject.toml') }}
          restore-keys: pex-${{ matrix.host }}-host-linux-${{ matrix.target-arch }}-

      # ── single-spark-job fat (JAR + ZIP + PEX) ───────────────────────────
      - name: Build single-spark-job for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/single-spark-job
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          mkdir -p "$OUT_DIR"
          uv-bundler --target spark-jar --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-zip --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-pex --arch ${{ matrix.target-arch }}

      # ── single-spark-job slim (JAR + ZIP + PEX — source only, no deps) ───
      - name: Build slim single-spark-job for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/single-spark-job
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          uv-bundler --target spark-jar-slim --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-zip-slim --arch ${{ matrix.target-arch }}
          uv-bundler --target spark-pex-slim --arch ${{ matrix.target-arch }}

      # ── numpy-etl (PEX — C extensions require PEX, not JAR/ZIP) ──────────
      - name: Build numpy-etl for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/numpy-etl
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          uv-bundler --target etl-${{ matrix.target-arch }}

      # ── lambda-zip (ZIP — Lambda deployment package, native orjson dep) ───
      - name: Build lambda-zip for linux/${{ matrix.target-arch }}
        working-directory: validation/samples/lambda-zip
        env:
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          uv-bundler --target lambda-${{ matrix.target-arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.host }}-host-linux-${{ matrix.target-arch }}
          path: |
            artifacts/single-spark-job-linux-${{ matrix.target-arch }}.*
            artifacts/single-spark-job-linux-${{ matrix.target-arch }}-slim.*
            artifacts/numpy-etl-linux-${{ matrix.target-arch }}.*
            artifacts/lambda-zip-linux-${{ matrix.target-arch }}.*
          retention-days: 7

  # ── Runtime validation ────────────────────────────────────────────────────
  #
  # Each artifact set (from every build host) is validated on the NATIVE runner
  # for its arch, run the way production runs it: spark-submit --py-files for
  # the Spark JAR/ZIP, AWS's Lambda runtime image for the Lambda ZIP, and a
  # clean python:3.10-slim container for the PEX. Slim artifacts and the Spark
  # PEX are validated for structure only.
  #
  validate-linux:
    name: Validate linux/${{ matrix.target-arch }} (built on ${{ matrix.host }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest       # x86_64 runtime
            target-arch: x86_64
            host: linux
          - runner: ubuntu-24.04-arm    # aarch64 runtime
            target-arch: aarch64
            host: linux
          - runner: ubuntu-latest
            target-arch: x86_64
            host: macos
          - runner: ubuntu-24.04-arm
            target-arch: aarch64
            host: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts-${{ matrix.host }}-host-linux-${{ matrix.target-arch }}
          path: artifacts

      # Each artifact is run the way its real runtime runs it — see
      # validation/run_artifacts.sh (also used locally via `make -C validation test-artifacts`).

      # ── single-spark-job: spark-submit --py-files, pyspark NOT bundled ────
      - name: spark-submit single-spark-job JAR + ZIP on linux/${{ matrix.target-arch }}
        run: validation/run_artifacts.sh spark artifacts ${{ matrix.target-arch }}

      # ── single-spark-job slim + PEX (structure only) ──────────────────────
      - name: Validate artifact structure for linux/${{ matrix.target-arch }}
        run: |
          python validation/validate_artifacts.py \
            --out-dir artifacts \
            --target-os linux \
            --target-arch ${{ matrix.target-arch }}

      # ── numpy-etl (native numpy/pandas C extensions via PEX) ─────────────
      - name: Run numpy-etl PEX on linux/${{ matrix.target-arch }}
        run: validation/run_artifacts.sh numpy artifacts ${{ matrix.target-arch }}

      # ── lambda-zip: invoke the handler in AWS's Lambda runtime image ──────
      - name: Invoke lambda-zip handler in the Lambda runtime on linux/${{ matrix.target-arch }}
        run: validation/run_artifacts.sh lambda artifacts ${{ matrix.target-arch }}
