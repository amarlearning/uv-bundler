name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies (uv)
        env:
          UV_PROJECT_ENVIRONMENT: .venv
        run: |
          uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Type check
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov=uv_pack --cov-report=term-missing
