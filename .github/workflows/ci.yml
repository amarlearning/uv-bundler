name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Lint & typecheck (runs once, not in matrix) ──────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - run: uv sync --all-extras

      - name: Ruff + Black
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Mypy
        run: uv run mypy src

  # ── Unit tests (matrix across supported Python versions) ─────────────────
  unit:
    name: Unit / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  # ── Integration tests (single Python version, gated on unit) ─────────────
  integration:
    name: Integration Tests
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - run: uv sync --all-extras

      - name: Run integration tests
        run: uv run pytest tests/integration -q

  # ── Benchmarks (only on push to main, not on every PR) ───────────────────
  benchmarks:
    name: Benchmarks
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - run: uv sync --all-extras

      - name: Run benchmarks
        run: uv run pytest tests/benchmarks -q -k bench
