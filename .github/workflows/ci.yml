name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync environment
        run: |
          make setup

      - name: Lint
        run: |
          make lint

      - name: Typecheck
        run: |
          make type

      - name: Unit tests
        env:
          UV: uv
        run: |
          UV_PROJECT_ENVIRONMENT=.venv uv run pytest -q tests/unit

      - name: Benchmarks
        env:
          UV: uv
        run: |
          UV_PROJECT_ENVIRONMENT=.venv uv run pytest -q tests/benchmarks -k bench

  integration:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync environment
        run: |
          make setup

      - name: Integration tests
        env:
          UV: uv
        run: |
          UV_PROJECT_ENVIRONMENT=.venv uv run pytest -q tests/integration
